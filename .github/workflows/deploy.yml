name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Variable du dépôt DOMAINE (Settings → Secrets and variables → Actions → Variables) :
    # vide → artauc.github.io/<dépôt>/ ; « aufildestruffes.fr » → site servi sur le domaine.
    env:
      DOMAINE: ${{ vars.DOMAINE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Adresse du site
        run: |
          if [ -n "$DOMAINE" ]; then
            echo "SITE_URL=https://$DOMAINE" >> "$GITHUB_ENV"
            echo "PATH_PREFIX=/" >> "$GITHUB_ENV"
          else
            echo "SITE_URL=https://${GITHUB_REPOSITORY_OWNER,,}.github.io" >> "$GITHUB_ENV"
            echo "PATH_PREFIX=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"
          fi
      - run: npx @11ty/eleventy
      - if: env.DOMAINE != ''
        run: echo "$DOMAINE" > _site/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Tant que le dépôt est privé, on construit seulement (vérification), sans publier.
    if: ${{ !github.event.repository.private }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
